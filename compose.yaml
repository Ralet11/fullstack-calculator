services:
  backend:
    build: ./backend
    environment:
      CALCULATOR_ADDR: 0.0.0.0:8080
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - --header
        - "Content-Type: application/json"
        - --post-data
        - '{"operation":"add","a":1,"b":2}'
        - http://127.0.0.1:8080/api/calculate
      interval: 5s
      timeout: 2s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:8088:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 2s
      retries: 5
